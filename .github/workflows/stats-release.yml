# Builds the instrumented "stats" APK and signs it with a key this workflow invents.
#
# The fork exists to measure Metrolist next to another player, which needs an installable release
# build and nothing else. A release key is generated here on every run rather than kept as a
# secret: nothing is published to a store, no update has to verify against a previous signature,
# and a throwaway key means there is no key to create, store or leak.
#
# The trade that buys: every run signs with a different key, so Android treats each build as a
# different signer. Upgrading in place fails with INSTALL_FAILED_UPDATE_INCOMPATIBLE — uninstall
# the previous stats build first. The app id is changed too, so this never collides with a real
# Metrolist install and both can sit on the phone at once.

name: Stats release APK

on:
  workflow_dispatch:
  push:
    branches:
      - stats

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      METROLIST_APPLICATION_ID: com.metrolist.music.stats
      METROLIST_APP_NAME: Metrolist Stats

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Invent a signing key
        id: signing
        run: |
          set -euo pipefail
          STORE_PASSWORD="$(openssl rand -base64 33 | tr -d '\n')"
          KEY_PASSWORD="$STORE_PASSWORD"
          KEY_ALIAS=stats

          mkdir -p app/keystore
          keytool -genkeypair \
            -keystore app/keystore/release.keystore \
            -storetype PKCS12 \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -alias "$KEY_ALIAS" \
            -keyalg RSA -keysize 4096 -validity 10000 \
            -dname "CN=Metrolist Stats Build, OU=Measurement, O=Fork, C=US"

          # ::add-mask:: keeps the generated passwords out of the run log even though the key is
          # discarded with the runner.
          echo "::add-mask::$STORE_PASSWORD"
          {
            echo "STORE_PASSWORD=$STORE_PASSWORD"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
          } >> "$GITHUB_ENV"

      - name: Build the signed release APK
        # --no-daemon because build.gradle.kts reads the signing passwords with System.getenv,
        # which returns the DAEMON's environment — a warm daemon started without them signs the
        # release with the debug key instead, silently. --no-configuration-cache for the same
        # reason: a restored entry must not decide the signing config for this run.
        run: ./gradlew :app:assembleFossRelease --no-daemon --no-configuration-cache

      - name: Name the output
        id: apk
        run: |
          set -euo pipefail
          path="$(find app/build/outputs/apk -name '*.apk' -print -quit)"
          test -n "$path"
          stamp="$(date -u +%Y%m%d-%H%M%S)"
          name="metrolist-stats-${stamp}-${GITHUB_SHA::7}.apk"
          cp "$path" "$name"
          echo "path=$name" >> "$GITHUB_OUTPUT"
          echo "tag=stats-${stamp}" >> "$GITHUB_OUTPUT"
          echo "Built $name ($(du -h "$name" | cut -f1))"

      - name: Confirm it is signed with this run's key
        run: |
          set -euo pipefail
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -print | sort | tail -1)"
          certs="$("$apksigner" verify --print-certs "${{ steps.apk.outputs.path }}")"
          echo "$certs"
          # An unsigned APK or one carrying the debug certificate means the signing config did not
          # apply, and shipping it would waste a whole test round on a build nobody can install.
          echo "$certs" | grep -q "Metrolist Stats Build" || {
            echo "::error::release was not signed with the key this run generated"
            exit 1
          }

      - name: Upload as a run artifact
        uses: actions/upload-artifact@v4
        with:
          name: metrolist-stats-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Publish a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.tag }}
          name: Metrolist Stats ${{ steps.apk.outputs.tag }}
          body: |
            Instrumented build for measuring playback against another client.

            App id `com.metrolist.music.stats`, so it installs alongside a real Metrolist.
            Signed with a key generated by this run — uninstall any previous stats build before
            installing this one, since the signatures will not match.

            Settings → Playback stats: turn on the capture, play, then share the log.
          files: ${{ steps.apk.outputs.path }}
          fail_on_unmatched_files: true
